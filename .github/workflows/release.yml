name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('transcribe_offline/models.py') }}
      - name: install.bat end to end
        shell: cmd
        run: install.bat
      - name: Nothing written outside the folder
        shell: pwsh
        run: |
          $paths = "$env:USERPROFILE\.local\bin\python*.exe", "HKCU:\Software\Python\Astral",
            "$env:LOCALAPPDATA\uv", "$env:APPDATA\uv"
          foreach ($p in $paths) { if (Test-Path $p) { Write-Error "Written outside the folder: $p"; exit 1 } }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --frozen
      - name: Firewall-block outbound traffic for the app's Python executables
        shell: pwsh
        run: |
          Get-ChildItem .venv, .uv -Recurse -Filter "python*.exe" | ForEach-Object {
            New-NetFirewallRule -DisplayName "block $($_.FullName)" -Direction Outbound -Action Block -Program $_.FullName
          }
      - name: Real-model smoke test (outbound firewall block for the Python executables + pytest-socket)
        run: uv run pytest -m slow
  publish:
    needs: install-and-smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build zip + SHA256SUMS
        run: |
          name="transcribe-offline-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="$name/" -o "$name.zip" "$GITHUB_REF_NAME"
          sha256sum "$name.zip" > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: transcribe-offline-*.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" transcribe-offline-*.zip SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME"
