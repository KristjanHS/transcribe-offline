name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup.py re-hashes every cached model file, so a poisoned cache cannot ship.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] v6.1.0
        with:
          path: app/models
          key: models-${{ hashFiles('app/transcribe_offline/models.py') }}
      - name: install.bat end to end (after marking its start time)
        shell: cmd # zizmor: ignore[misfeature] install.bat is what users run.
        run: type nul > "%RUNNER_TEMP%\install-t0" && install.bat
      - name: Real-model smoke test in the installed .venv, under the runtime guard
        working-directory: app
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -c @'
          from transcribe_offline import guard
          guard.install()  # as __main__ does
          from transcribe_offline import APP_ROOT, engine
          from transcribe_offline.models import MODELS_ROOT
          for lang, wav, word in [('et', 'et.wav', 'Tartus'), ('en', 'en.wav', 'Gettysburg')]:
              model = engine.load_model(MODELS_ROOT, lang)
              out = engine.transcribe_file(model, APP_ROOT / 'tests' / 'fixtures' / wav, lang, timestamps=False, on_progress=lambda f: None, cancelled=lambda: False)
              text = out.read_text(encoding='utf-8')
              assert word in text, text
          '@
      - name: Nothing written outside the folder by install or smoke test (user profile, %TEMP%, uv's registry key)
        shell: pwsh
        run: |
          $t0 = (Get-Item "$env:RUNNER_TEMP\install-t0").LastWriteTimeUtc
          # Windows' own files: registry hives, certificate-revocation cache, pwsh's own folder.
          $os = '\\(NTUSER|UsrClass)\.DAT|\\CryptnetUrlCache\\|\\Microsoft\\PowerShell(\\|$)'
          $new = @(Get-ChildItem $env:USERPROFILE, $env:TEMP -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.CreationTimeUtc -gt $t0 -or (!$_.PSIsContainer -and $_.LastWriteTimeUtc -gt $t0) } |
            ForEach-Object FullName | Where-Object { $_ -notmatch $os } | Sort-Object -Unique)
          if (Test-Path "HKCU:\Software\Python\Astral") { $new += "HKCU:\Software\Python\Astral" }
          $new | ForEach-Object { Write-Host "Written outside the folder: $_" }
          if ($new.Count) { exit 1 }
  publish:
    needs: install-and-smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - name: Build zip + SBOM + SHA256SUMS
        run: |
          name="transcribe-offline-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="$name/" -o "$name.zip" "$GITHUB_REF_NAME"
          uv export --project app --frozen --no-dev --format cyclonedx1.5 > sbom.cdx.json
          sha256sum "$name.zip" sbom.cdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            transcribe-offline-*.zip
            sbom.cdx.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" transcribe-offline-*.zip sbom.cdx.json SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME"
