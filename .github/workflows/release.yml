name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-exe:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the earlier release's tag, for the installer/ diff
      # A rebuilt exe has a new hash and starts with no Windows reputation, so reuse it while installer/ is unchanged.
      - name: Rebuild or reuse the previous release's Transcribe-Setup.exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/setup-exe-reuse.sh "$GITHUB_REF_NAME" .
      - name: Build Transcribe-Setup.exe with the in-box .NET Framework compiler
        if: env.REBUILD == 'true'
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /optimize+ /warnaserror+ /out:Transcribe-Setup.exe installer\Setup.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: env.REBUILD == 'true' # each exe hash is attested once, by the run that compiled it
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Transcribe-Setup.exe
      - name: Reminder for a rebuilt exe
        if: env.REBUILD == 'true'
        shell: pwsh
        run: Add-Content $env:GITHUB_STEP_SUMMARY "Rebuilt Transcribe-Setup.exe (new hash). After publishing, submit it at https://www.microsoft.com/en-us/wdsi/filesubmission (Software developer, Microsoft Defender SmartScreen, Incorrectly detected)."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Transcribe-Setup
          path: Transcribe-Setup.exe
          if-no-files-found: error
  install-and-smoke:
    needs: setup-exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Transcribe-Setup
      # setup.py re-hashes every cached model file, so a poisoned cache cannot ship.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] v6.1.0
        with:
          path: app/models
          key: models-${{ hashFiles('app/transcribe_offline/models.py') }}
      # Install and smoke test run as a standard user, tuser: the runner image's background tasks (Firefox's
      # agent, Windows' web caches) write to runneradmin's profile, so the final check scans tuser's alone.
      - name: Let standard users modify this folder, create tuser and its profile, mark the start time
        shell: pwsh
        run: |
          icacls $PWD /grant '*S-1-5-32-545:(OI)(CI)M' /T /Q  # BUILTIN\Users
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The first logon creates the profile; the second, into an existing profile, creates tuser's DPAPI key.
          foreach ($i in 1, 2) {
            .github\scripts\as-standard-user.ps1 "$env:SystemRoot\System32\cmd.exe" '/d /c exit'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          New-Item -ItemType File "$env:RUNNER_TEMP\install-t0" | Out-Null
      - name: Transcribe-Setup.exe end to end, as tuser
        shell: pwsh
        run: .github\scripts\as-standard-user.ps1 "$PWD\Transcribe-Setup.exe"
      - &lnk
        name: Transcribe.lnk starts the venv's pythonw.exe in app\
        shell: pwsh
        run: |
          $l = (New-Object -ComObject WScript.Shell).CreateShortcut("$PWD\Transcribe.lnk")
          $l | Format-List TargetPath, Arguments, WorkingDirectory
          if (!(Test-Path Transcribe.lnk) -or $l.TargetPath -ne "$PWD\app\.venv\Scripts\pythonw.exe" -or
              $l.Arguments -ne '-m transcribe_offline' -or $l.WorkingDirectory -ne "$PWD\app") { exit 1 }
          Remove-Item Transcribe.lnk
      - name: install.bat resuming it (the fallback path), as tuser
        shell: pwsh
        run: .github\scripts\as-standard-user.ps1 "$env:SystemRoot\System32\cmd.exe" '/d /c install.bat'
      - *lnk
      - name: Real-model smoke test in the installed .venv, under the runtime guard, as tuser
        working-directory: app
        shell: pwsh
        run: |
          $code = @'
          from transcribe_offline import guard
          guard.install()  # as __main__ does
          from transcribe_offline import APP_ROOT, engine
          from transcribe_offline.models import MODELS_ROOT
          for lang, wav, word in [('et', 'et.wav', 'Tartus'), ('en', 'en.wav', 'Gettysburg')]:
              model = engine.load_model(MODELS_ROOT, lang)
              out = engine.transcribe_file(model, APP_ROOT / 'tests' / 'fixtures' / wav, lang, timestamps=False, on_progress=lambda f: None, cancelled=lambda: False)
              text = out.read_text(encoding='utf-8')
              assert word in text, text
          '@
          ..\.github\scripts\as-standard-user.ps1 "$PWD\.venv\Scripts\python.exe" "-c `"$code`""
      - name: Nothing written outside the folder by install or smoke test (tuser's profile and %TEMP%, uv's registry key)
        shell: pwsh
        run: |
          $t0 = (Get-Item "$env:RUNNER_TEMP\install-t0").LastWriteTimeUtc
          $h = (Get-CimInstance Win32_UserProfile | Where-Object LocalPath -Like '*\tuser').LocalPath
          if (!$h) { exit 1 }
          # Windows' own files: registry hives, certificate-revocation cache (and its LocalLow parent), the shell's
          # empty Caches folder, Windows PowerShell's folder (install.bat's shortcut), and the .NET Framework's
          # per-exe usage log (the setup exe, Windows PowerShell).
          $os = '\\(NTUSER|UsrClass)\.DAT|\\LocalLow\\Microsoft(\\CryptnetUrlCache(\\|$)|$)|\\Microsoft\\Windows\\Caches$|' +
            '\\Microsoft\\Windows\\PowerShell(\\|$)|\\Microsoft\\CLR_v4\.0(_32)?(\\|$)'
          $new = @(Get-ChildItem $h -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.CreationTimeUtc -gt $t0 -or (!$_.PSIsContainer -and $_.LastWriteTimeUtc -gt $t0) } |
            ForEach-Object { '{0:HH:mm:ss.fff} {1}' -f $_.LastWriteTimeUtc, $_.FullName } |  # the time names the step
            Where-Object { $_ -notmatch $os } | Sort-Object -Unique)
          .github\scripts\as-standard-user.ps1 "$env:SystemRoot\System32\reg.exe" 'query HKCU\Software\Python\Astral'
          if (!$LASTEXITCODE) { $new += "tuser's HKCU\Software\Python\Astral" }
          $new | ForEach-Object { Write-Host "Written outside the folder: $_" }
          exit [int]($new.Count -gt 0)  # not reg.exe's exit code
  publish:
    needs: [setup-exe, install-and-smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Transcribe-Setup
      - name: Build zip (with the tested exe) + SBOM + SHA256SUMS
        run: |
          name="transcribe-offline-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="$name/" -o "$name.zip" "$GITHUB_REF_NAME"
          mkdir "$name" && cp Transcribe-Setup.exe "$name/" && zip -q "$name.zip" "$name/Transcribe-Setup.exe"
          uv export --project app --frozen --no-dev --format cyclonedx1.5 > sbom.cdx.json
          sha256sum "$name.zip" Transcribe-Setup.exe sbom.cdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            transcribe-offline-*.zip
            sbom.cdx.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" transcribe-offline-*.zip Transcribe-Setup.exe sbom.cdx.json SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME"
