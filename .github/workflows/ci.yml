name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, so a new advisory against a pinned version is seen
permissions:
  contents: read
defaults:
  run:
    working-directory: app
env:
  # uv's managed Python, as install.bat uses; ubuntu's system Python has no tkinter.
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run bandit -q -r transcribe_offline
      - run: uv run zizmor --offline ../.github
      - run: uv run pytest
      - name: Setup.cs compiles with the in-box .NET Framework compiler, as release.yml builds it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /optimize+ /warnaserror+ /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /win32manifest:..\installer\Setup.manifest /out:"$env:RUNNER_TEMP\Transcribe-Setup.exe" ..\installer\Setup.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: pip-audit on the locked runtime deps
        if: runner.os == 'Linux'
        run: |
          uv export --frozen --no-dev --format requirements-txt > requirements.txt
          uv run pip-audit --disable-pip --require-hashes -r requirements.txt
